<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Block Crush - Telegram Web App</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .block-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            background: #1e293b;
            padding: 8px;
            border-radius: 12px;
        }
        .block-cell {
            aspect-ratio: 1;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .block-cell:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body class="flex flex-col h-screen justify-between p-4">

    <!-- Top Header: Balance & Level -->
    <header class="flex justify-between items-center bg-slate-800 p-3 rounded-xl border border-slate-700">
        <div>
            <p class="text-xs text-slate-400">Հաշվեկշիռ</p>
            <p class="text-xl font-bold text-yellow-400"><span id="balance">0</span> $BLOCKS</p>
        </div>
        <div class="text-right">
            <p class="text-xs text-slate-400">Մակարդակ</p>
            <p class="text-lg font-semibold text-blue-400" id="level">1</p>
        </div>
    </header>

    <!-- Main Game Area -->
    <main class="flex-1 flex flex-col justify-center items-center my-4">
        <div class="w-full max-w-sm">
            <div id="grid" class="block-grid shadow-2xl">
                <!-- Blocks will be generated dynamically -->
            </div>
        </div>
    </main>

    <!-- Navigation Tabs -->
    <nav class="grid grid-cols-4 gap-2 bg-slate-800 p-2 rounded-xl border border-slate-700">
        <button class="flex flex-col items-center p-2 text-yellow-400">
            <i class="fa-solid fa-gamepad text-lg"></i>
            <span class="text-xs mt-1">Խաղ</span>
        </button>
        <button class="flex flex-col items-center p-2 text-slate-400 hover:text-white">
            <i class="fa-solid fa-list-check text-lg"></i>
            <span class="text-xs mt-1">Առաջադրանք</span>
        </button>
        <button class="flex flex-col items-center p-2 text-slate-400 hover:text-white">
            <i class="fa-solid fa-users text-lg"></i>
            <span class="text-xs mt-1">Ընկերներ</span>
        </button>
        <button class="flex flex-col items-center p-2 text-slate-400 hover:text-white">
            <i class="fa-solid fa-wallet text-lg"></i>
            <span class="text-xs mt-1">Քսակ</span>
        </button>
    </nav>

    <!-- Game Logic JavaScript -->
    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        let score = 0;
        let currentLevel = 1;

        const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];
        const grid = document.getElementById('grid');
        const balanceEl = document.getElementById('balance');

        // Create 8x8 Board
        function initBoard() {
            grid.innerHTML = '';
            for (let i = 0; i < 64; i++) {
                const cell = document.createElement('div');
                cell.className = 'block-cell';
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                cell.style.backgroundColor = randomColor;
                
                cell.addEventListener('click', () => {
                    score += 10;
                    balanceEl.innerText = score;
                    cell.style.opacity = '0.3';
                    setTimeout(() => {
                        cell.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                        cell.style.opacity = '1';
                    }, 200);

                    if (tg && tg.HapticFeedback) {
                        tg.HapticFeedback.impactOccurred('light');
                    }
                });

                grid.appendChild(cell);
            }
        }

        initBoard();
    </script>
</body>
</html>
